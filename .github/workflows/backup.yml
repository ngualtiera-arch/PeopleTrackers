name: Database backup

# Free-tier Supabase has no automated backups at all — this is the free replacement. Dumps go to
# the same Supabase project's own Storage (a private bucket, "db-backups") rather than a new
# service, using credentials already in use elsewhere. Keeps a rolling 30 days; a single dump of
# this database is a few MB, so 30 of them stays well inside the free 1 GB storage cap.
on:
  schedule:
    - cron: '0 15 * * *' # 1am AEST / 3am AEST during daylight saving — low-traffic window
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FILENAME="backup-$(date -u +%Y-%m-%d).dump"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -Fc -f "$FILENAME"

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/storage/v1/object/db-backups/$FILENAME" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FILENAME"

      - name: Prune backups older than 30 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d)
          OLD=$(curl -sf -X POST "$SUPABASE_URL/storage/v1/object/list/db-backups" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1000,"sortBy":{"column":"name","order":"asc"}}' \
            | jq -r --arg cutoff "$CUTOFF" '[.[] | select(.name < ("backup-" + $cutoff)) | .name]')
          if [ "$OLD" != "[]" ]; then
            curl -sf -X DELETE "$SUPABASE_URL/storage/v1/object/db-backups" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefixes\": $OLD}"
          fi
