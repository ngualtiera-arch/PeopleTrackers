name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no database activity — everything
# becomes unreachable until someone manually resumes it in the dashboard. Every 3 days leaves
# comfortable margin even if a run or two fails.
on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "select 1;"
