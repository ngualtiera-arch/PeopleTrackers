name: Deploy web to Cloudflare Pages

# Replaces Netlify's git-push auto-deploy — moved off Netlify after its team ran out of
# operational credits and paused production deploys mid-project. Cloudflare Pages' free tier has
# no billing/credit model to run dry the same way (no card on file unless the account is
# deliberately upgraded), so this is the replacement CI pipeline for the same behaviour: push to
# main, the frontend redeploys.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_URL: https://peopletrackersapi-production.up.railway.app
        run: npm run build -w apps/web

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/dist --project-name=peopletrackers --branch=main

